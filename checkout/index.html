<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Checkout | CARLIGHT CLUB</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/checkout.css" />
    <script src="/js/stripe-config.js"></script>
    <script src="https://js.stripe.com/v3/"></script>
    <script src="/js/checkout-page.js" defer></script>
  </head>
  <body class="checkout-page">
    <header class="checkout-header">
      <div class="checkout-header-inner">
        <a class="checkout-brand" href="/" aria-label="CARLIGHT CLUB home">
          <img
            class="checkout-logo"
            src="/Poster/ChatGPT%20Image%202026%E5%B9%B42%E6%9C%889%E6%97%A5%2015_16_52%201.png"
            alt="CARLIGHT CLUB"
            width="1304"
            height="287"
          />
        </a>
        <a class="checkout-cart-link" href="/collections/all/" aria-label="Cart">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M6 6h15l-1.5 9H8L6 6Zm0 0L5 3H2M9 20a1 1 0 1 0 0-2 1 1 0 0 0 0 2Zm8 0a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <span class="checkout-cart-count" id="checkout-cart-count" hidden>0</span>
        </a>
      </div>
    </header>

    <div class="checkout-mobile-summary" id="checkout-mobile-summary">
      <button
        type="button"
        class="checkout-mobile-summary-toggle"
        id="checkout-mobile-summary-toggle"
        aria-expanded="false"
        aria-controls="checkout-mobile-summary-panel"
      >
        <span class="checkout-mobile-summary-label">
          <span class="checkout-mobile-summary-text">Order summary</span>
          <span class="checkout-mobile-summary-total" id="checkout-mobile-total">$0.00</span>
        </span>
        <svg class="checkout-chevron" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
          <path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5" />
        </svg>
      </button>
      <div
        class="checkout-mobile-summary-panel"
        id="checkout-mobile-summary-panel"
        hidden
      >
        <div id="checkout-mobile-product-list"></div>
        <div class="checkout-totals" id="checkout-mobile-totals"></div>
      </div>
    </div>

    <main class="checkout-layout">
      <div class="checkout-column-main">
      <form class="checkout-main" id="checkout-form" novalidate>
        <section class="checkout-block checkout-block--express" aria-label="Express checkout">
          <h2 class="checkout-block-title">Express checkout</h2>
          <div id="checkout-express-element" class="checkout-express-slot"></div>
          <div class="checkout-divider" role="separator"><span>OR</span></div>
        </section>

        <section class="checkout-block" aria-labelledby="checkout-contact-heading">
          <h2 class="checkout-block-title" id="checkout-contact-heading">Contact</h2>
          <div class="checkout-field">
            <label class="checkout-label" for="checkout-email">Email</label>
            <input
              class="checkout-input"
              type="email"
              id="checkout-email"
              name="email"
              autocomplete="email"
              required
            />
          </div>
          <p class="checkout-inline-link">
            Have an account?
            <a href="/collections/all/">Sign in</a>
          </p>
          <label class="checkout-checkbox">
            <input type="checkbox" name="newsletter" id="checkout-newsletter" />
            <span>Email me with news and offers</span>
          </label>
        </section>

        <section class="checkout-block" aria-labelledby="checkout-delivery-heading">
          <h2 class="checkout-block-title" id="checkout-delivery-heading">Delivery</h2>
          <div class="checkout-field">
            <label class="checkout-label" for="checkout-country">Country/Region</label>
            <select class="checkout-input checkout-select" id="checkout-country" name="country" required>
              <option value="US">United States</option>
              <option value="CA">Canada</option>
              <option value="GB">United Kingdom</option>
              <option value="AU">Australia</option>
              <option value="MY" selected>Malaysia</option>
              <option value="SG">Singapore</option>
              <option value="DE">Germany</option>
              <option value="FR">France</option>
              <option value="IT">Italy</option>
              <option value="ES">Spain</option>
              <option value="NL">Netherlands</option>
              <option value="JP">Japan</option>
              <option value="KR">South Korea</option>
              <option value="NZ">New Zealand</option>
              <option value="HK">Hong Kong</option>
              <option value="AE">United Arab Emirates</option>
            </select>
          </div>
          <div class="checkout-field-row checkout-field-row--half">
            <div class="checkout-field">
              <label class="checkout-label" for="checkout-first-name">First name</label>
              <input class="checkout-input" type="text" id="checkout-first-name" name="firstName" autocomplete="given-name" required />
            </div>
            <div class="checkout-field">
              <label class="checkout-label" for="checkout-last-name">Last name</label>
              <input class="checkout-input" type="text" id="checkout-last-name" name="lastName" autocomplete="family-name" required />
            </div>
          </div>
          <div class="checkout-field">
            <label class="checkout-label" for="checkout-company">Company (optional)</label>
            <input class="checkout-input" type="text" id="checkout-company" name="company" autocomplete="organization" />
          </div>
          <div class="checkout-field">
            <label class="checkout-label" for="checkout-address">Address</label>
            <input class="checkout-input" type="text" id="checkout-address" name="address" autocomplete="street-address" required />
          </div>
          <div class="checkout-field">
            <label class="checkout-label" for="checkout-apartment">Apartment, suite, etc. (optional)</label>
            <input class="checkout-input" type="text" id="checkout-apartment" name="apartment" autocomplete="address-line2" />
          </div>
          <div class="checkout-field-row checkout-field-row--thirds">
            <div class="checkout-field">
              <label class="checkout-label" for="checkout-city">City</label>
              <input class="checkout-input" type="text" id="checkout-city" name="city" autocomplete="address-level2" required />
            </div>
            <div class="checkout-field">
              <label class="checkout-label" for="checkout-state">State</label>
              <input class="checkout-input" type="text" id="checkout-state" name="state" autocomplete="address-level1" />
            </div>
            <div class="checkout-field">
              <label class="checkout-label" for="checkout-postcode">Postcode</label>
              <input class="checkout-input" type="text" id="checkout-postcode" name="postcode" autocomplete="postal-code" required />
            </div>
          </div>
          <div class="checkout-field">
            <label class="checkout-label" for="checkout-phone">Phone</label>
            <input class="checkout-input" type="tel" id="checkout-phone" name="phone" autocomplete="tel" />
          </div>
        </section>

        <section class="checkout-block" aria-labelledby="checkout-shipping-heading">
          <h2 class="checkout-block-title" id="checkout-shipping-heading">Shipping method</h2>
          <div class="checkout-shipping-options" id="checkout-shipping-options">
            <label class="checkout-shipping-option">
              <input type="radio" name="shippingMethod" value="standard" checked />
              <span class="checkout-shipping-option-body">
                <span class="checkout-shipping-option-name">Standard worldwide shipping</span>
                <span class="checkout-shipping-option-meta">Estimated 7–14 business days</span>
              </span>
              <span class="checkout-shipping-option-price" data-shipping-price="0">Free</span>
            </label>
          </div>
        </section>

        <section class="checkout-block" aria-labelledby="checkout-payment-heading">
          <h2 class="checkout-block-title" id="checkout-payment-heading">Payment</h2>
          <p class="checkout-block-sub">All transactions are secure and encrypted.</p>
          <div class="checkout-payment-methods" aria-hidden="true">
            <span>Card</span>
            <span>PayPal</span>
            <span>Apple Pay</span>
            <span>Google Pay</span>
          </div>
          <div id="checkout-payment-element" class="checkout-payment-slot"></div>
          <div id="checkout-stripe-embedded" class="checkout-stripe-embedded" hidden></div>
          <p class="checkout-secure-note">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M12 3l7 4v5c0 4.4-2.9 8.5-7 9-4.1-.5-7-4.6-7-9V7l7-4z" stroke="currentColor" stroke-width="1.5" />
            </svg>
            Secure payment powered by Stripe
          </p>
        </section>

        <section class="checkout-block" aria-labelledby="checkout-billing-heading">
          <h2 class="checkout-block-title" id="checkout-billing-heading">Billing address</h2>
          <label class="checkout-checkbox">
            <input type="radio" name="billingAddress" value="same" checked />
            <span>Same as shipping address</span>
          </label>
          <label class="checkout-checkbox">
            <input type="radio" name="billingAddress" value="different" />
            <span>Use a different billing address</span>
          </label>
          <div class="checkout-billing-fields" id="checkout-billing-fields" hidden>
            <div class="checkout-field">
              <label class="checkout-label" for="checkout-billing-address">Address</label>
              <input class="checkout-input" type="text" id="checkout-billing-address" name="billingAddressLine" />
            </div>
            <div class="checkout-field-row checkout-field-row--half">
              <div class="checkout-field">
                <label class="checkout-label" for="checkout-billing-city">City</label>
                <input class="checkout-input" type="text" id="checkout-billing-city" name="billingCity" />
              </div>
              <div class="checkout-field">
                <label class="checkout-label" for="checkout-billing-postcode">Postcode</label>
                <input class="checkout-input" type="text" id="checkout-billing-postcode" name="billingPostcode" />
              </div>
            </div>
          </div>
        </section>

        <div class="checkout-error" id="checkout-error" hidden role="alert"></div>
        <div class="checkout-loading" id="checkout-loading">
          <div class="checkout-spinner" aria-hidden="true"></div>
          <p>Preparing secure checkout…</p>
        </div>

        <button type="submit" class="checkout-btn-pay" id="checkout-pay-btn" disabled>
          Complete order
        </button>
      </form>

      <footer class="checkout-footer">
        <nav class="checkout-footer-links" aria-label="Policies">
          <a href="/contact.html">Contact</a>
          <a href="/collections/all/">Shop</a>
        </nav>
      </footer>
      </div>

      <aside class="checkout-sidebar" aria-label="Order summary">
        <div class="checkout-sidebar-inner">
          <div class="checkout-line-items" id="checkout-product-list"></div>

          <div class="checkout-discount">
            <div class="checkout-discount-row">
              <input
                class="checkout-input checkout-discount-input"
                type="text"
                id="checkout-discount-code"
                placeholder="Discount code"
                autocomplete="off"
              />
              <button type="button" class="checkout-btn-apply" id="checkout-discount-apply">Apply</button>
            </div>
            <p class="checkout-discount-msg" id="checkout-discount-msg" hidden></p>
          </div>

          <div class="checkout-totals" id="checkout-order-totals"></div>
        </div>
      </aside>
    </main>
  </body>
</html>
