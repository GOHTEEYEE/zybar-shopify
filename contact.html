<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico?v=5" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=5" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png?v=5" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png?v=5" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=5" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us | ZYBAR</title>
    <meta
      name="description"
      content="Contact ZYBAR for product inquiries, custom requests, and support."
    />
    <link rel="canonical" href="https://zybar-ledcar.pages.dev/contact.html" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Contact Us | ZYBAR" />
    <meta property="og:description" content="Contact ZYBAR for product inquiries, custom requests, and support." />
    <meta property="og:url" content="https://zybar-ledcar.pages.dev/contact.html" />
    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/js/nav-drawer.js" defer></script>
    <script src="/js/zybar-my-env.js" defer></script>
  </head>
  <body>
    <div class="welcome-bar">Welcome to our store</div>
    <header class="site-header">
      <div class="container header-wrap">
        <a class="brand zybar-logo" href="/">
          <img src="/Poster/ChatGPT Image 2026年2月9日 15_16_52 1.png" alt="ZYBAR" class="logo-img" loading="eager" width="1304" height="287" />
        </a>
        <nav class="nav main-nav">
          <a href="/">Home</a>
          <a href="/collections/all/">Catalog</a>
          <a href="/contact.html">Contact</a>
        </nav>
        <div class="header-actions">
          <span class="currency">USD ▾</span>
          <a href="/collections/all/" class="icon-btn" aria-label="Cart">🛒</a>
        </div>
      </div>
    </header>

    <main class="contact-page">
      <section class="contact-hero container">
        <p class="contact-eyebrow">Get In Touch</p>
        <h1>Contact Us</h1>
        <p class="contact-subtitle">
          Tell us what build you are interested in. We will get back to you as soon as possible.
        </p>
      </section>

      <section class="container contact-section">
        <div class="contact-glass-card">
          <form id="contactForm" novalidate>
            <div class="contact-grid">
              <label class="contact-field">
                <span>Name *</span>
                <input id="contactName" name="name" type="text" required placeholder="Your full name" />
              </label>
              <label class="contact-field">
                <span>Email *</span>
                <input id="contactEmail" name="email" type="email" required placeholder="you@example.com" />
              </label>
              <label class="contact-field">
                <span>Phone Number</span>
                <input id="contactPhone" name="phone" type="tel" placeholder="+60 12-345 6789" />
              </label>
              <label class="contact-field">
                <span>Car Model Interest *</span>
                <input id="contactCarModel" name="carModelInterest" type="text" required placeholder="e.g. Audi R8 White" />
              </label>
              <label class="contact-field contact-field-full">
                <span>Message *</span>
                <textarea id="contactMessage" name="message" rows="6" required placeholder="Tell us your preferred model, size, and any custom request."></textarea>
              </label>
            </div>
            <div class="contact-actions">
              <button type="submit" class="btn contact-submit-btn">Send Inquiry</button>
              <a href="/" class="btn btn-outline">Back to Home</a>
            </div>
            <p id="contactFormStatus" class="contact-status" aria-live="polite"></p>
          </form>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-wrap">
        <div class="footer-copyright">
          <p>© 2026 <a href="/">ZYBAR</a>, Powered by Shopify</p>
          <a href="/policies/privacy-policy/">Privacy policy</a>
        </div>
      </div>
    </footer>

    <div id="contactToast" class="contact-toast" role="status" aria-live="polite" aria-hidden="true"></div>
    <script src="/js/contact.js?v=2"></script>
      <script src="/js/chatbot.js"></script>
      <link rel="stylesheet" href="/css/premium-popup.css" />
    <script src="/js/premium-popup/popup-storage.js" defer></script>
    <script src="/js/premium-popup/analytics.js" defer></script>
    <script src="/js/premium-popup/index.js" defer></script>
    <script src="/js/site-footer.js" defer></script>
</body>
</html>
